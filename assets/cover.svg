<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f2f5f7"/>
  <rect width="1280" height="8" fill="#0074c8"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#111820">
    <rect x="56" y="48" width="34" height="34" fill="none" stroke="#0074c8" stroke-width="2"/>
    <text x="73" y="70" text-anchor="middle" font-size="12" font-weight="800" fill="#0074c8">1E</text>
    <text x="103" y="69" font-size="12" font-weight="800" letter-spacing="2.2">ONE EYE AUTOMATION</text>

    <text x="56" y="160" font-size="12" font-weight="800" letter-spacing="2.1" fill="#0074c8">PYTHON SOURCE KIT · V1.0.1</text>
