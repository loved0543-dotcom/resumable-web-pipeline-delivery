    <text x="724" y="411" font-family="Consolas, monospace" font-size="13">P-001  Resume-safe Product      2400</text>
    <text x="724" y="440" font-family="Consolas, monospace" font-size="13">P-002  Evidence-first Pipeline 5900</text>

    <g font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">
