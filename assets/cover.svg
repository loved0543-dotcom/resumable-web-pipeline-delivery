    <text x="651" y="148" font-size="11" font-weight="800" letter-spacing="1.1" fill="#0074c8">INPUT</text>
    <text x="724" y="149" font-family="Consolas, monospace" font-size="13">record_id,url</text>
    <text x="724" y="174" font-family="Consolas, monospace" font-size="13">P-001,fixture://product_a</text>
    <text x="724" y="196" font-family="Consolas, monospace" font-size="13">P-002,fixture://product_b</text>

    <text x="904" y="229" text-anchor="middle" font-size="18" font-weight="900" fill="#0074c8">↓</text>
