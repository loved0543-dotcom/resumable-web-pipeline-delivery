    <text x="651" y="269" font-size="11" font-weight="800" letter-spacing="1.1" fill="#0074c8">CONFIG</text>
    <text x="724" y="270" font-family="Consolas, monospace" font-size="13">name   → h1.product-title</text>
    <text x="724" y="295" font-family="Consolas, monospace" font-size="13">amount → [data-price] · digits</text>
    <text x="724" y="320" font-family="Consolas, monospace" font-size="13">sku    → #sku · optional</text>

    <text x="904" y="370" text-anchor="middle" font-size="18" font-weight="900" fill="#0074c8">↓</text>
    <rect x="632" y="385" width="544" height="89" fill="#ffffff" stroke="#d7dfe5"/>
